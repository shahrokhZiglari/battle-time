<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <style>
      /* یک حداقل‌استایل مستقل که بدون نیاز به ساخت (build) هم نمایش داده می‌شود؛

      html, body { height: 100%; margin: 0; }
      body {
        background: #05131a;
        color: #f6efe2;
        font-family: "Vazirmatn", "Tahoma", "Segoe UI", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        box-sizing: border-box;
      }
      .fallback { max-width: 560px; text-align: center; line-height: 2; }
      .fallback h1 { color: #e8b44c; font-size: 28px; margin-bottom: 8px; }
      .fallback p { color: #cdd9de; font-size: 14px; }
      .fallback code {
        display: block;
        unicode-bidi: plaintext;
        text-align: left;
        direction: ltr;
        background: #0a212c;
        border: 1px solid rgba(232, 180, 76, .35);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 14px 0;
        color: #9ff5c4;
        font-size: 13px;
      }
      .fallback .tag { color: #ff8a80; font-weight: bold; }

    <div id="root">
      <!--
        این بخش فقط زمانی دیده می‌شود که اسکریپت React (ماژول src/main.tsx) اجرا نشده باشد؛
        مثلاً وقتی این فایلِ خامِ پروژه را مستقیم (با دابل‌کلیک) باز کرده‌اید، نه فایل ساخته‌شده.
      -->
      <div class="fallback">
        <h1>⚔ نبرد قلعه‌ها</h1>
        <p>بازی آفلاین در حال بارگذاری است...</p>
        <p>اگر این پیام باقی ماند، فایل را با نسخهٔ جدید Chrome، Edge یا Firefox باز کنید.</p>
      </div>
    </div>
  
<script>
(function () {
  var failures = [];
  function text(value) {
    try { return String(value && (value.message || value.reason || value)); }
    catch (_) { return "خطای ناشناخته"; }
  }
  window.addEventListener("error", function (event) { failures.push(text(event.error || event.message)); });
  window.addEventListener("unhandledrejection", function (event) { failures.push(text(event.reason)); });
  window.setTimeout(function () {
    var root = document.getElementById("root");
    if (!root || !root.querySelector(".fallback")) return;
    var detail = failures.length ? failures.join(" | ") : "مرورگر اجازه اجرای جاوااسکریپت محلی را نداده یا بسیار قدیمی است.";
    root.innerHTML = '<div class="fallback"><h1>بازی اجرا نشد</h1>' +
      '<p>این فایل کاملاً آفلاین است. آن را با Chrome، Edge یا Firefox جدید باز کنید.</p>' +
      '<p class="tag">جزئیات:</p><code style="direction:ltr;text-align:left;white-space:pre-wrap">' +
      detail.replace(/[&<>]/g, function (ch) { return ({"&":"&amp;","<":"&lt;",">":"&gt;"})[ch]; }) +
      '</code></div>';
  }, 1800);
})();
</script>
