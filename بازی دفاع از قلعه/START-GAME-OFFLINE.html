<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06141b" />
    <meta name="description" content="نبرد قلعه‌ها — بازی راهبردی آفلاین با انتخاب کشیدنی قلعه‌ها" />
    <title>نبرد قلعه‌ها | بازی آفلاین</title>
    <style>
      /* یک حداقل‌استایل مستقل که بدون نیاز به ساخت (build) هم نمایش داده می‌شود؛

      html, body { height: 100%; margin: 0; }
      body {
        background: #05131a;
        color: #f6efe2;
        font-family: "Vazirmatn", "Tahoma", "Segoe UI", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        box-sizing: border-box;
      }
      .fallback { max-width: 560px; text-align: center; line-height: 2; }
      .fallback h1 { color: #e8b44c; font-size: 28px; margin-bottom: 8px; }
      .fallback p { color: #cdd9de; font-size: 14px; }
      .fallback code {
        display: block;
        unicode-bidi: plaintext;
        text-align: left;
        direction: ltr;
        background: #0a212c;
        border: 1px solid rgba(232, 180, 76, .35);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 14px 0;
        color: #9ff5c4;
        font-size: 13px;
      }
      .fallback .tag { color: #ff8a80; font-weight: bold; }
    </style>

      '</code></div>';
  }, 1800);
})();
